name: Deploy Backend

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ink_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/850771094851/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@ink-backend-adlay.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t europe-west2-docker.pkg.dev/ink-backend-adlay/ink/ink-api:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            europe-west2-docker.pkg.dev/ink-backend-adlay/ink/ink-api:${{ github.sha }}

      - name: Update database migration job
        run: |
          gcloud run jobs update ink-db-migrate \
            --region=europe-west2 \
            --image=europe-west2-docker.pkg.dev/ink-backend-adlay/ink/ink-api:${{ github.sha }}

      - name: Run database migrations
        run: |
          gcloud run jobs execute ink-db-migrate \
            --region=europe-west2 \
            --wait

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ink-api
          region: europe-west2
          image: europe-west2-docker.pkg.dev/ink-backend-adlay/ink/ink-api:${{ github.sha }}

      - name: Verify deployment health
        run: curl --fail --show-error "${{ steps.deploy.outputs.url }}/health"