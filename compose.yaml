services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DICTIONARY_API_BASE_URL: ${DICTIONARY_API_BASE_URL:-https://api.dictionaryapi.dev/api/v2}
      DICTIONARY_API_TIMEOUT: ${DICTIONARY_API_TIMEOUT:-5.0}
      MERRIAM_WEBSTER_API_KEY: ${MERRIAM_WEBSTER_API_KEY}
      MERRIAM_WEBSTER_API_BASE_URL: ${MERRIAM_WEBSTER_API_BASE_URL:-https://www.dictionaryapi.com/api/v3/references/learners/json}
      MERRIAM_WEBSTER_API_TIMEOUT: ${MERRIAM_WEBSTER_API_TIMEOUT:-5.0}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
